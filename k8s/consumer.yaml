apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: sandbox-orchestrator
  labels:
    app.kubernetes.io/name: consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer
    spec:
      serviceAccountName: consumer
      # Sandbox startup timeout is 20s; leave room to finish and ack on SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: localhost/orchestrator:dev
          imagePullPolicy: Never
          command: ["consumer"]
          envFrom:
            - configMapRef:
                name: orchestrator-config
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }

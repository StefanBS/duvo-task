# A Rollout (Argo Rollouts) instead of a Deployment: new versions go out as a
# canary. There is no traffic router for a queue, so the canary's share of Jobs
# is its share of replicas competing in the same consumer group (see README).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: consumer
  namespace: sandbox-orchestrator
  labels:
    app.kubernetes.io/name: consumer
spec:
  replicas: 2 # granularity of the canary split: 1 replica = 50% of consumers
  revisionHistoryLimit: 3
  strategy:
    canary:
      # Pod labels by role, copied onto metrics by the PodMonitor as `track`.
      canaryMetadata:
        labels:
          track: canary
      stableMetadata:
        labels:
          track: stable
      maxSurge: 1
      maxUnavailable: 0
      # Automated cutover: each step must pass the metric-based health gate
      # (k8s/analysis.yaml). No manual pauses; `just canary-promote-full` / `just canary-abort` override.
      steps:
        - setWeight: 50 # 1 of 2 consumers runs the new version
        - analysis:
            templates:
              - templateName: consumer-canary-health
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
              - name: stable-hash
                valueFrom:
                  podTemplateHashValue: Stable
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer
    spec:
      # Avoid Service-link env vars (e.g. ALERT_RECEIVER_PORT=tcp://...) clashing with our config.
      enableServiceLinks: false
      serviceAccountName: consumer
      # Sandbox startup timeout is 10s; leave room to finish and ack on SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: localhost/orchestrator:dev
          imagePullPolicy: Never
          command: ["consumer"]
          ports:
            - name: metrics
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: orchestrator-config
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }

apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: sandbox-orchestrator
data:
  REDIS_URL: redis://redis:6379/0
  JOB_STREAM: jobs
  CONSUMER_GROUP: consumers
  STREAM_MAXLEN: "1000"
  JOBS_PER_SECOND: "1"
  CLAIM_IDLE_MS: "30000"
  CLAIM_INTERVAL_S: "5"
  SANDBOX_NAMESPACE: sandboxes
  SANDBOX_IMAGE: ghcr.io/stefanprodan/podinfo:6.9.2
  SANDBOX_PORT: "9898"
  SANDBOX_TTL_S: "20"
  SANDBOX_STARTUP_TIMEOUT_S: "10"
  SANDBOX_REAP_INTERVAL_S: "10"

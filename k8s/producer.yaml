apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: sandbox-orchestrator
  labels:
    app.kubernetes.io/name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer
    spec:
      # Avoid Service-link env vars (e.g. ALERT_RECEIVER_PORT=tcp://...) clashing with our config.
      enableServiceLinks: false
      containers:
        - name: producer
          image: localhost/orchestrator:dev
          imagePullPolicy: Never
          command: ["producer"]
          ports:
            - name: metrics
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: orchestrator-config
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }

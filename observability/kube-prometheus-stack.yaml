# Trimmed for a single-node k3d: no node-exporter, no control-plane scraping,
# no default rules/dashboards. Our rules and dashboards live in observability/k8s.
defaultRules:
  create: false
nodeExporter:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Pick up PodMonitors/PrometheusRules from any namespace, not just this release's.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: alert-receiver
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: "null" # referenced by the chart's default routes (e.g. Watchdog)
      - name: alert-receiver
        webhook_configs:
          - url: http://alert-receiver.sandbox-orchestrator.svc.cluster.local:8080/alerts
            send_resolved: true

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

grafana:
  adminPassword: admin # Shortcut: static credentials, port-forward access only.
  defaultDashboardsEnabled: false
  # Grafana 13 needs ~600Mi resident: ~220Mi of heap plus ~385Mi of its own mapped binary.
  # At a 512Mi limit the kernel kept evicting and re-reading those pages (~400 MB/s of disk reads),
  # which stalled Grafana and the whole host. GOMEMLIMIT makes the Go GC work well before the
  # cgroup limit, so heap (≤400Mi) + binary always fit under 1Gi.
  env:
    GOMEMLIMIT: 400MiB
  resources:
    requests: { cpu: 50m, memory: 640Mi }
    limits: { memory: 1Gi }
  # Features this project doesn't use: alerting goes through Prometheus + Alertmanager,
  # and there's no need for plugin downloads, update checks or the news feed.
  grafana.ini:
    unified_alerting: { enabled: false }
    plugins: { preinstall_disabled: true }
    analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false, feedback_links_enabled: false }
    news: { news_feed_enabled: false }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy

controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  configMap:
    content: |
      // Tail pod logs via the Kubernetes API (no hostPath mounts needed on k3d).
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["sandbox-orchestrator", "sandboxes"]
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }

      // Only `level` is promoted to a label; jobId, event, url etc. stay in the
      // line and are extracted at query time with `| json` (keeps cardinality low).
      loki.process "json" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.template {
          source   = "level"
          template = "{{ `{{ ToLower .Value }}` }}" // escaped: the chart runs this through Helm tpl
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
